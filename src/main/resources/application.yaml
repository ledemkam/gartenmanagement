spring:
  application:
    name: gartenmanagement
  output:
    ansi:
      enabled: ALWAYS
  profiles:
    active:
      - development
  cache:
    type: simple
  messages:
    basename: i18n/messages
    encoding: UTF-8

  datasource:
    url: ${DB_URL}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 5
      idle-timeout: 30000
      connection-timeout: 20000
      max-lifetime: 1200000


  jpa:
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
        jdbc:
          batch_size: 20
        order_updates: true
        order_inserts: true
    open-in-view: true


  # Flyway configuration for database migrations
  flyway:
    enabled: true
    baseline-on-migrate: true
    locations:
     - classpath:db/migration
    schemas: public
    table: flyway_schema_history
    validate-on-migrate: true

server:
  port: ${SERVER_PORT:8181}
  compression:
    enabled: true
    min-response-size: 1024
    excluded-media-types: image/png,image/jpeg,image/gif,image/webp

  #Actuator configuration for monitoring and
management:
  endpoints:
    web:
      exposure:
        include: health,info,prometheus,metrics
  endpoint:
    health:
      show-details: never

# Configuration logging for Development
logging:
  level:
    root: INFO
    de0.backend.gartenmanagement: DEBUG
    org.springframework.web: DEBUG
    org.hibernate.SQL: DEBUG
    org.springframework.transaction: DEBUG
    org.springframework.cache: TRACE
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
  pattern:
    console: '%clr(%d{yyyy-MM-dd HH:mm:ss}){faint} %clr([%thread]){blue} %clr(%-5level){highlight} %clr(%logger{36}){cyan} - %msg%n'
    file: '%d{yyyy-MM-dd HH:mm:ss} [%thread] %-5level %logger{36} - %msg%n'
  include-application-group:

  # Springdoc OpenAPI configuration
springdoc:
  default-produces-media-type: application/json
  override-with-generic-response: false
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    operations-sorter: method
    tags-sorter: alpha

# Configuration for application-specific properties
app:
  business:
    name: Garten Pro
    contact-email: kontakt@gartemnt.de
    phone: "0123456789"
    address: "Gartenstrasse 123, D - 75000 MusterStat"
  stock:
    low-stock-threshold: 10
    reorder-delay-days: 7
    auto-reorder: true
  pricing:
    default-tax-rate: 20.0
    max-discount-rate: 30.0
    currency: EUR



