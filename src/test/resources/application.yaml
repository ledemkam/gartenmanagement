spring:
  application:
    name: gartenmanagement_test
  profiles:
    active:
      - test

  main:
    allow-bean-definition-overriding: true

  # Configuration de base de données H2
  datasource:
    url: jdbc:h2:mem:testdb
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    show-sql: false
  h2:
    console:
      enabled: false

# Configuration logging for Testing (JUnit & Mockito)
logging:
  level:
    root: WARN
    de0.backend.gartenmanagement: DEBUG
    org.springframework: WARN
    org.springframework.test: DEBUG
    org.springframework.data: WARN
    org.hibernate.SQL: DEBUG
    org.hibernate.type.descriptor.sql.BasicBinder: TRACE
    org.mockito: INFO
  pattern:
    console: '[%thread] %-5level %logger{36} - %msg%n'


management:
  endpoints:
    access:
      default: none


